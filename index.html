<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="logo.png">
    <title>หมากฮอสไทย RETRO</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="start-screen" class="overlay">
        <h1 class="retro-title">หมากฮอสไทย<br><span style="font-size: 20px;">RETRO CHECKERS</span></h1>
        <p>SELECT DIFFICULTY</p>
        <div class="menu-buttons">
            <button onclick="startGame(1)">EASY</button>
            <button onclick="startGame(4)">NORMAL</button>
            <button onclick="startGame(8)">HARD (AI SMART)</button>
            <button id="start-sound-btn" onclick="toggleSound()">🔊 SOUND: ON</button>
        </div>
    </div>

    <div class="game-container" style="display:none;" id="game-ui">
        <div class="game-wrapper">
            <div class="stats-bar">
                <span id="status">YOUR TURN</span>
                <div class="score">W: <span id="white-count">8</span> | B: <span id="black-count">8</span></div>
                <div class="actions">
                    <button class="mini-btn" id="game-sound-btn" onclick="toggleSound()">🔊 ON</button>
                    <button class="mini-btn" onclick="backToMenu()">MENU</button>
                </div>
            </div>
            <div id="board" class="board"></div>
        </div>
    </div>

    <div id="retro-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <h2 id="modal-title">VICTORY</h2>
            <p id="modal-message">SYSTEM HACKED SUCCESSFULLY</p>
            <button onclick="backToMenu()">REBOOT</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
